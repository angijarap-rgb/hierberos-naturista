# SAST: análisis estático de código con CodeQL (JavaScript/TypeScript).
name: CodeQL

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  analizar:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
